{id:8,name:"KAZE Sunglasses",category:"Others",price:699,old:899,discount:"22%",tag:"",meta:"Accessory • One Size",image:"assets/wallet.svg"}]; const id=Number(new URLSearchParams(location.search).get("id"))||1,p=PRODUCTS.find(x=>x.id===id)||PRODUCTS[0],money=n=>"₹"+Number(n).toLocaleString("en-IN");document.title="KAZE — "+p.name;document.getElementById("crumb").textContent=p.name;const gallery=[p.image,p.image,p.image];document.getElementById("detail").innerHTML=`<section class="detail"><div><div class="gallery-main"><img id="mainImg" src="${p.image}" alt="${p.name}"></div><div class="gallery-thumbs">${gallery.map((x,i)=>`<button type="button" data-img="${x}"><img src="${x}" alt="Product view ${i+1}"></button>`).join("")}</div></div><div class="detail-info"><span class="eyebrow">${p.category.toUpperCase()} • KAZE</span><h1>${p.name}</h1><div class="detail-price"><strong>${money(p.price)}</strong><del>${money(p.old)}</del><span class="discount">-${p.discount}</span></div><p class="detail-description">A premium KAZE pick designed for everyday style, comfort and easy pairing.</p><ul class="detail-list"><li>Quality-focused everyday design</li><li>Easy to style with your wardrobe</li><li>Selected by KAZE for everyday use</li></ul><label style="font-size:10px;font-weight:800">SIZE<select id="sizeSelect" style="display:block;margin-top:6px;width:100%;padding:12px;border:1px solid #ddd;border-radius:9px">${(p.category==="Shoes"?["6","7","8","9","10"]:["One Size"]).map(x=>`<option>${x}</option>`).join("")}</select></label><button id="addBtn" class="primary-btn full" style="margin-top:14px">ADD TO BAG →</button><a class="outline-btn" style="margin-top:10px;width:100%;justify-content:center" href="https://wa.me/919946375868?text=${encodeURIComponent("Hi KAZE, I am interested in "+p.name)}" target="_blank" rel="noopener">ASK ON WHATSAPP</a></div></section>`;document.querySelectorAll("[data-img]").forEach(b=>b.onclick=()=>document.getElementById("mainImg").src=b.dataset.img);document.getElementById("addBtn").onclick=()=>{let cart=JSON.parse(localStorage.getItem("kazeCartV3")||"[]"),size=document.getElementById("sizeSelect").value,color=p.colors?.[0]||"#111",same=cart.find(x=>x.id===p.id&&x.size===size&&x.color===color);if(same)same.qty++;else cart.push({...p,qty:1,size,color});localStorage.setItem("kazeCartV3",JSON.stringify(cart));alert("Added to your KAZE bag.");};const key="kazeReviews_"+p.id,getReviews=()=>JSON.parse(localStorage.getItem(key)||"[]");function renderReviews(){document.getElementById("reviews").innerHTML=getReviews().map(r=>`<div class="review"><div class="review-top"><span>${r.name}</span><span>${"★".repeat(r.rating)}${"☆".repeat(5-r.rating)}</span></div><p>${String(r.text).replace(/[<>]/g,"")}</p></div>`).join("")||'<div class="review"><small>No reviews yet — be the first.</small></div>'}document.getElementById("reviewForm").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),a=getReviews();a.unshift({name:String(f.get("name")),rating:Number(f.get("rating")),text:String(f.get("text"))});localStorage.setItem(key,JSON.stringify(a));e.target.reset();renderReviews()};renderReviews();</script></body></html>
